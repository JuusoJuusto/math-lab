server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Next.js build assets are content-hashed and can be cached long-term.
    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Exported Next.js routes are directories containing index.html.
    # Keep the trailing-slash URLs generated by next.config.ts working.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Do not cache the root language redirect or HTML pages.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
