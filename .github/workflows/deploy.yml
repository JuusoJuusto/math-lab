name: Deploy to Cloudflare Workers

# Runs when main changes, or by hand from the Actions tab.
# It does nothing (and does not fail) until the two secrets below exist, so merging this file never deploys by itself.
#
#   CLOUDFLARE_API_TOKEN    an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   the account the Worker belongs to
#
# If you use Cloudflare's own Git integration (Workers Builds) instead, delete this file.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Look for Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed. See docs/DEPLOYMENT.md."
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install, test and build
        if: steps.credentials.outputs.ready == 'true'
        run: |
          npm ci
          npm test
          npm run build
          npm run verify

      - name: Deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
