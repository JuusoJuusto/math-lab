# The same headers as public/_headers (which Cloudflare reads). Included in every location that sets its own headers,
# because nginx forgets the headers of the outer level as soon as a location uses add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://insaneones.xyz; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
