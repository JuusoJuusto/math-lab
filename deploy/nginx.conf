# nginx for the static MathLab site (the out/ folder). Used by the Dockerfile, which is what Coolify builds.
server {
    # IPv4 only: Coolify and the tunnel reach the container over IPv4, and an IPv6 listener stops nginx from starting on a host without IPv6.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep to the address the visitor used, which matters behind Coolify's proxy (/en -> /en/).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Every screen is a real folder with an index.html: /fi/learn/two-step/ -> fi/learn/two-step/index.html.
    # A folder without the closing slash is sent to the one with it, as on Cloudflare.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # The files under /_next/static/ have a hash of their content in the name, so they never change.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Older nginx versions do not know the manifest's type, so it is named here.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The logo and the icons keep their names, so they are cached for a day.
    location ~* ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|icon-[a-z0-9-]+\.png|og-image\.png)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # An unknown address gets the app's own page, with the status 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cloudflare reads this file and never serves it; here it is only a copy of the header settings.
    location = /_headers {
        return 404;
    }

    # Coolify (and Docker) use this to see that the site is up.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
